<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<title>cloudrepo</title>
<link rel="icon" href="CydiaIcon.png">
<link rel="apple-touch-icon" href="CydiaIcon.png">
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --tx:#000; --mut:#8e8e93; --line:rgba(60,60,67,.18);
    --fill:rgba(120,120,128,.16); --btn:#000; --btn-tx:#fff;
    --icon-a:#9a9a9f; --icon-b:#5c5c61; --glow:rgba(0,0,0,.10);
    --sk1:rgba(120,120,128,.12); --sk2:rgba(120,120,128,.26);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000; --card:#1c1c1e; --tx:#fff; --mut:#8e8e93; --line:rgba(84,84,88,.55);
      --fill:rgba(120,120,128,.32); --btn:#fff; --btn-tx:#000;
      --icon-a:#8e8e93; --icon-b:#48484a; --glow:rgba(255,255,255,.12);
      --sk1:rgba(120,120,128,.18); --sk2:rgba(120,120,128,.38);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--tx);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 20px 60px;position:relative}

  /* ---------- animations ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}60%{transform:scale(1.07) rotate(1deg)}100%{opacity:1;transform:none}}
  @keyframes breathe{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.15)}}
  @keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
  @keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .in{animation:fadeUp .7s var(--ease) both;animation-delay:calc(var(--d,0) * 1ms)}

  .glow{
    position:absolute;top:-80px;left:50%;width:520px;height:340px;pointer-events:none;z-index:0;
    background:radial-gradient(closest-side,var(--glow),transparent);
    transform:translateX(-50%);animation:breathe 7s ease-in-out infinite;
  }
  .wrap > *:not(.glow){position:relative;z-index:1}

  /* ---------- language switch ---------- */
  .bar{display:flex;justify-content:flex-end;padding-top:16px}
  .lang{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;position:relative}
  .lang button{
    appearance:none;border:0;background:transparent;color:var(--mut);cursor:pointer;
    font:700 12px/1 -apple-system,system-ui,sans-serif;letter-spacing:.5px;padding:6px 12px;border-radius:999px;
    position:relative;z-index:1;transition:color .3s var(--ease);
  }
  .lang button[aria-pressed="true"]{color:var(--btn-tx)}
  .lang .thumb{
    position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--btn);
    transition:transform .35s var(--ease);
  }
  .lang[data-lang="ru"] .thumb{transform:translateX(100%)}

  /* ---------- header ---------- */
  .top{padding:28px 0 6px;display:flex;align-items:center;gap:16px}
  .logo{
    width:72px;height:72px;border-radius:22.37%;flex:none;object-fit:cover;
    box-shadow:0 2px 10px rgba(0,0,0,.28);animation:pop .8s var(--ease) both;
    transition:transform .4s var(--ease);
  }
  @media (hover:hover){.logo:hover{transform:rotate(-5deg) scale(1.06)}}
  h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px}
  .sub{color:var(--mut);font-size:15px;margin-top:3px}
  .gets{display:flex;gap:10px;margin:18px 0 0;align-items:center;flex-wrap:wrap}

  /* ---------- buttons ---------- */
  .get{
    appearance:none;border:0;cursor:pointer;text-decoration:none;display:inline-block;
    background:var(--btn);color:var(--btn-tx);font:700 15px/1 -apple-system,system-ui,sans-serif;
    padding:9px 20px;border-radius:999px;letter-spacing:.3px;
    transition:opacity .2s,transform .25s var(--ease),box-shadow .25s;
  }
  @media (hover:hover){.get:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 6px 16px rgba(0,0,0,.22)}}
  .get:active{opacity:.6;transform:scale(.95)}
  .get.soft{background:var(--fill);color:var(--tx)}
  .get.big{padding:12px 26px;font-size:16px}

  /* ---------- other managers ---------- */
  details{margin-top:14px}
  summary{color:var(--mut);font-size:14px;cursor:pointer;list-style:none;display:inline-block;transition:color .2s}
  summary:hover{color:var(--tx)}
  summary::-webkit-details-marker{display:none}
  summary::after{content:" ›";display:inline-block;transition:transform .3s var(--ease)}
  details[open] summary::after{transform:rotate(90deg)}
  .more{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  details[open] .more .get{animation:drop .4s var(--ease) both}
  details[open] .more .get:nth-child(2){animation-delay:60ms}
  details[open] .more .get:nth-child(3){animation-delay:120ms}

  /* ---------- search ---------- */
  .search{
    margin:26px 0 8px;display:flex;align-items:center;gap:8px;background:var(--fill);
    border-radius:10px;padding:8px 10px;transition:box-shadow .3s var(--ease),transform .3s var(--ease);
  }
  .search:focus-within{box-shadow:0 0 0 2px var(--mut);transform:scale(1.01)}
  .search svg{width:16px;height:16px;flex:none;opacity:.55}
  .search input{
    flex:1;border:0;outline:0;background:transparent;color:var(--tx);font-size:17px;
    font-family:inherit;min-width:0;
  }
  .search input::placeholder{color:var(--mut)}

  /* ---------- sections + rows ---------- */
  h2{font-size:22px;font-weight:700;margin:28px 0 10px;letter-spacing:.2px}
  .group{background:var(--card);border-radius:16px;overflow:hidden}
  .row{
    display:flex;align-items:center;gap:14px;padding:12px 14px;text-decoration:none;color:inherit;
    transition:background .2s,transform .25s var(--ease);position:relative;
  }
  .row + .row::before{content:"";position:absolute;top:0;right:0;left:90px;height:.5px;background:var(--line)}
  @media (hover:hover){.row:hover{background:var(--fill)}}
  .row:active{background:var(--fill);transform:scale(.99)}
  .anim .row,.anim h2{animation:fadeUp .6s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
  .ico{
    width:60px;height:60px;border-radius:22.37%;flex:none;overflow:hidden;
    background:linear-gradient(145deg,var(--icon-a),var(--icon-b));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:26px;font-weight:700;box-shadow:0 0 0 .5px var(--line);
    transition:transform .35s var(--ease);
  }
  @media (hover:hover){.row:hover .ico{transform:scale(1.06) rotate(-3deg)}}
  .ico img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{flex:1;min-width:0}
  .name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .desc{font-size:13px;color:var(--mut);margin-top:2px;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ver{font-size:12px;color:var(--mut);margin-top:3px}
  .empty{color:var(--mut);text-align:center;padding:28px 12px;font-size:15px;animation:fadeIn .5s both}

  /* skeleton while loading */
  .sk{display:flex;align-items:center;gap:14px;padding:12px 14px}
  .sk i,.sk b,.sk u{
    display:block;border-radius:8px;text-decoration:none;
    background:linear-gradient(90deg,var(--sk1) 0,var(--sk2) 100px,var(--sk1) 200px);
    background-size:400px 100%;animation:shimmer 1.3s linear infinite;
  }
  .sk i{width:60px;height:60px;border-radius:22.37%;flex:none}
  .sk div{flex:1}
  .sk b{height:14px;width:55%;margin-bottom:9px}
  .sk u{height:11px;width:85%}

  footer{text-align:center;color:var(--mut);font-size:12px;margin-top:36px}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px) scale(.9);
    background:var(--btn);color:var(--btn-tx);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:10;
  }
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

  @media (max-width:420px){.get.big{padding:12px 16px;font-size:15px}.gets{gap:8px}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>

  <div class="bar in" style="--d:0">
    <div class="lang" id="lang" data-lang="en" role="group" aria-label="Language">
      <span class="thumb"></span>
      <button type="button" data-l="en" aria-pressed="true">EN</button>
      <button type="button" data-l="ru" aria-pressed="false">RU</button>
    </div>
  </div>

  <div class="top in" style="--d:80">
    <img class="logo" src="CydiaIcon.png" alt="">
    <div>
      <h1>cloudrepo</h1>
      <div class="sub" data-i18n="subtitle">we are here : t.me/iosexploiter</div>
    </div>
  </div>

  <div class="gets in" style="--d:160">
    <a class="get big" href="sileo://source/https://dontbeskid.github.io/" data-i18n="open">Open in Sileo</a>
    <button class="get soft big" id="copy" data-i18n="copy">Copy URL</button>
  </div>

  <details class="in" style="--d:220">
    <summary data-i18n="others">Other managers</summary>
    <div class="more">
      <a class="get soft" href="zbra://sources/add/https://dontbeskid.github.io/">Zebra</a>
      <a class="get soft" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://dontbeskid.github.io/">Cydia</a>
      <a class="get soft" href="installer://add/repo=https://dontbeskid.github.io/">Installer</a>
    </div>
  </details>

  <label class="search in" style="--d:280">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" data-i18n-ph="search" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false">
  </label>

  <div id="list"></div>

  <footer class="in" style="--d:400">dontbeskid.github.io</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const REPO = "https://dontbeskid.github.io/";

/* ---------- localization (English by default) ---------- */
const I18N = {
  en: {
    subtitle: "Sileo repository", open: "Open in Sileo", copy: "Copy URL", copied: "Copied",
    others: "Other managers", search: "Search", get: "GET",
    none: "No packages yet", nomatch: "Nothing found", error: "Couldn't load the list",
    prompt: "Copy this:"
  },
  ru: {
    subtitle: "Репозиторий для Sileo", open: "Открыть в Sileo", copy: "Копировать", copied: "Скопировано",
    others: "Другие менеджеры", search: "Поиск", get: "GET",
    none: "Пока нет пакетов", nomatch: "Ничего не найдено", error: "Не удалось загрузить список",
    prompt: "Скопируй:"
  }
};
const SECTIONS_RU = {
  Tweaks: "Твики", Themes: "Темы", Utilities: "Утилиты", Miscellaneous: "Разное",
  Addons: "Дополнения", Applications: "Приложения", Games: "Игры", Development: "Разработка"
};

function detectLang(){
  try { const s = localStorage.getItem("lang"); if (s && I18N[s]) return s; } catch (e) {}
  const n = (navigator.language || "en").toLowerCase();
  return n.startsWith("ru") ? "ru" : "en";
}
let lang = detectLang();
const t = k => I18N[lang][k];
const secName = s => (lang === "ru" && SECTIONS_RU[s]) || s;

/* ---------- state ---------- */
let PKGS = [];
let STATE = "loading";   // loading | ok | error
let firstRender = true;

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  const sw = document.getElementById("lang");
  sw.dataset.lang = lang;
  sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
}

document.querySelectorAll("#lang button").forEach(b => {
  b.onclick = () => {
    lang = b.dataset.l;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    applyLang();
    render(document.getElementById("q").value, false);
  };
});

/* ---------- copy ---------- */
const toast = document.getElementById("toast");
let toastTimer;
function showToast(msg){
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(REPO); showToast(t("copied")); }
  catch (e) { prompt(t("prompt"), REPO); }
};

/* ---------- Packages parser ---------- */
function parse(text){
  return text.split(/\n\s*\n/).map(b => {
    const o = {}; let last = null;
    b.split("\n").forEach(l => {
      l = l.replace(/\r$/, "");
      if (/^\s/.test(l) && last) { o[last] += "\n" + l.trim(); return; }
      const i = l.indexOf(":"); if (i < 1) return;
      last = l.slice(0, i); o[last] = l.slice(i + 1).trim();
    });
    return o;
  }).filter(p => p.Package);
}

/* ---------- rendering ---------- */
function letter(p){ return (p.Name || p.Package)[0].toUpperCase(); }

function row(p){
  const a = document.createElement("a");
  a.className = "row";
  a.href = "sileo://package/" + encodeURIComponent(p.Package);

  const ico = document.createElement("div"); ico.className = "ico";
  if (p.Icon && /^https?:/.test(p.Icon)) {
    const im = document.createElement("img"); im.src = p.Icon; im.alt = "";
    im.onerror = () => { im.remove(); ico.textContent = letter(p); };
    ico.append(im);
  } else {
    ico.textContent = letter(p);
  }

  const meta = document.createElement("div"); meta.className = "meta";
  const n = document.createElement("div"); n.className = "name"; n.textContent = p.Name || p.Package;
  const d = document.createElement("div"); d.className = "desc"; d.textContent = (p.Description || "").split("\n")[0];
  const v = document.createElement("div"); v.className = "ver"; v.textContent = "v" + p.Version;
  meta.append(n, d, v);

  const g = document.createElement("span"); g.className = "get"; g.textContent = t("get");
  a.append(ico, meta, g);
  return a;
}

function skeleton(){
  let h = '<div class="group">';
  for (let i = 0; i < 3; i++) h += '<div class="sk"><i></i><div><b></b><u></u></div></div>';
  return h + "</div>";
}
function message(key){
  return '<div class="group"><div class="empty">' + t(key) + "</div></div>";
}

function render(filter, animate){
  const box = document.getElementById("list");
  if (animate === undefined) animate = false;

  if (STATE === "loading") { box.className = ""; box.innerHTML = skeleton(); return; }
  if (STATE === "error")   { box.className = ""; box.innerHTML = message("error"); return; }

  const f = (filter || "").trim().toLowerCase();
  const items = PKGS.filter(p =>
    !f || (p.Name || "").toLowerCase().includes(f) ||
    p.Package.toLowerCase().includes(f) ||
    (p.Description || "").toLowerCase().includes(f));

  box.className = animate ? "anim" : "";
  if (!items.length) { box.innerHTML = message(PKGS.length ? "nomatch" : "none"); return; }

  box.innerHTML = "";
  const sections = {};
  items.forEach(p => { (sections[p.Section || "Tweaks"] ||= []).push(p); });
  let idx = 0;
  Object.keys(sections).sort().forEach(s => {
    const h = document.createElement("h2"); h.textContent = secName(s);
    h.style.setProperty("--i", Math.min(idx++, 14));
    const grp = document.createElement("div"); grp.className = "group";
    sections[s].sort((a, b) => (a.Name || a.Package).localeCompare(b.Name || b.Package))
      .forEach(p => { const r = row(p); r.style.setProperty("--i", Math.min(idx++, 14)); grp.append(r); });
    box.append(h, grp);
  });
}

document.getElementById("q").addEventListener("input", e => render(e.target.value, false));

/* ---------- start ---------- */
applyLang();
render("", false);

fetch("Packages?t=" + Date.now()).then(r => {
  if (!r.ok) throw new Error(r.status);
  return r.text();
}).then(txt => {
  const latest = {};
  parse(txt).forEach(p => { latest[p.Package] = p; });
  PKGS = Object.values(latest);
  STATE = "ok";
  render(document.getElementById("q").value, true);
}).catch(() => {
  STATE = "error";
  render("", false);
});
</script>
</body>
</html>
