<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cloudrepo</title>
<link rel="icon" href="CydiaIcon.png">
<style>
  :root{--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--tx:#f5f5f5;--mut:#8a8a8a;--ac:#f5f5f5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:32px 18px 60px}
  header{text-align:center;margin-bottom:28px}
  header img{width:84px;height:84px;border-radius:20px}
  h1{margin:12px 0 4px;font-size:28px}
  .sub{color:var(--mut);font-size:15px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 8px}
  .btn{background:var(--ac);color:#111;text-decoration:none;font-weight:600;padding:11px 18px;border-radius:12px;font-size:15px;border:0;cursor:pointer}
  .btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
  .url{text-align:center;color:var(--mut);font-size:13px;margin-top:10px;word-break:break-all}
  h2{font-size:18px;margin:34px 0 12px}
  .pkg{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .pkg b{font-size:16px} .pkg .d{color:var(--mut);font-size:13px;margin-top:3px}
  .pkg .v{color:var(--mut);font-size:12px;margin-left:6px}
  .pkg a{white-space:nowrap}
  .empty{color:var(--mut);text-align:center;padding:20px}
  footer{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="CydiaIcon.png" alt="">
    <h1>cloudrepo</h1>
    <div class="sub">Добавь репозиторий в свой менеджер пакетов</div>
    <div class="btns">
      <a class="btn" href="sileo://source/https://dontbeskid.github.io/">Open in Sileo</a>
      <a class="btn alt" href="zbra://sources/add/https://dontbeskid.github.io/">Add to Zebra</a>
      <a class="btn alt" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://dontbeskid.github.io/">Add to Cydia</a>
      <a class="btn alt" href="installer://add/repo=https://dontbeskid.github.io/">Add to Installer</a>
      <button class="btn alt" id="copy">Copy URL</button>
    </div>
    <div class="url">https://dontbeskid.github.io/</div>
  </header>

  <h2>Пакеты</h2>
  <div id="list"><div class="empty">Загрузка...</div></div>

  <footer>Powered by GitHub Pages</footer>
</div>

<script>
const REPO = "https://dontbeskid.github.io/";
document.getElementById("copy").onclick = async function () {
  try { await navigator.clipboard.writeText(REPO); this.textContent = "Copied!"; }
  catch (e) { prompt("Скопируй:", REPO); }
  setTimeout(() => (this.textContent = "Copy URL"), 1500);
};

function parse(text) {
  return text.split(/\n\s*\n/).map(b => {
    const o = {}; let last = null;
    b.split("\n").forEach(l => {
      if (/^\s/.test(l) && last) { o[last] += "\n" + l.trim(); return; }
      const i = l.indexOf(":"); if (i < 1) return;
      last = l.slice(0, i); o[last] = l.slice(i + 1).trim();
    });
    return o;
  }).filter(p => p.Package);
}

fetch("Packages?t=" + Date.now()).then(r => r.text()).then(t => {
  const pk = parse(t);
  const box = document.getElementById("list");
  if (!pk.length) { box.innerHTML = '<div class="empty">Пока нет пакетов</div>'; return; }
  box.innerHTML = "";
  const latest = {};
  pk.forEach(p => { latest[p.Package] = p; });
  Object.values(latest).forEach(p => {
    const el = document.createElement("div");
    el.className = "pkg";
    const left = document.createElement("div");
    const b = document.createElement("b"); b.textContent = p.Name || p.Package;
    const v = document.createElement("span"); v.className = "v"; v.textContent = "v" + p.Version;
    const d = document.createElement("div"); d.className = "d"; d.textContent = (p.Description || "").split("\n")[0];
    const t = document.createElement("div"); t.append(b, v);
    left.append(t, d);
    const a = document.createElement("a");
    a.className = "btn alt"; a.textContent = "Open";
    a.href = "sileo://package/" + encodeURIComponent(p.Package);
    el.append(left, a);
    box.append(el);
  });
}).catch(() => {
  document.getElementById("list").innerHTML = '<div class="empty">Не удалось загрузить список</div>';
});
</script>
</body>
</html>
