<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dontbeschool.lol</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Symbols:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #121316;
      --surface: #1e1f23;
      --surface-variant: #2a2c31;
      --surface-hover: #35373d;
      --primary: #c6c6ca;
      --on-surface: #e2e2e6;
      --on-surface-sub: #8e9099;
      --accent: #a8c7fa;
      --accent-container: #28354d;
      --accent-on-container: #d3e3fd;
      --radius: 20px;
      --transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    
    body { 
      background: var(--bg); 
      color: var(--on-surface); 
      padding: 16px; 
      max-width: 900px; 
      margin: 0 auto; 
      min-height: 100vh;
    }
    
    .icon {
      font-family: 'Google Symbols';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    
    h1 { 
      font-size: 1.6rem; 
      color: var(--primary); 
      letter-spacing: -0.5px; 
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-variant);
      color: var(--on-surface);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-weight: bold;
      font-size: 0.85rem;
    }
    .icon-btn:hover { background: var(--surface-hover); transform: scale(1.05); }

    .card { 
      background: var(--surface); 
      border-radius: var(--radius); 
      padding: 20px; 
      margin-bottom: 20px; 
      transition: var(--transition); 
    }

    .settings-panel {
      display: none;
      animation: fadeIn 0.3s forwards;
    }
    .settings-panel.active { display: block; }

    .prompt-box { 
      background: var(--surface-variant); 
      padding: 12px; 
      border-radius: 12px; 
      font-family: monospace; 
      font-size: 0.85rem; 
      color: var(--accent); 
      margin: 10px 0; 
      white-space: pre-wrap; 
      word-break: break-word; 
    }
    
    input[type="text"], textarea { 
      width: 100%; 
      background: var(--surface-variant); 
      border: 1px solid var(--surface-hover); 
      border-radius: 12px; 
      color: var(--on-surface); 
      padding: 12px; 
      font-family: monospace; 
      margin-top: 10px; 
    }
    textarea { height: 120px; resize: vertical; }
    input[type="text"]:focus, textarea:focus { outline: 2px solid var(--accent); }

    .btn { 
      background: var(--accent-container); 
      color: var(--accent-on-container); 
      border: none; 
      padding: 10px 20px; 
      border-radius: 20px; 
      font-weight: 500; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      transition: var(--transition); 
      margin-top: 10px; 
    }
    .btn:hover { opacity: 0.9; transform: scale(1.02); }

    .days-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 16px; 
    }
    
    .day-card { 
      background: var(--surface); 
      border-radius: var(--radius); 
      padding: 16px; 
      transition: var(--transition);
    }
    .day-card:hover { background: var(--surface-hover); }

    .day-title { 
      font-size: 1.1rem; 
      font-weight: 700; 
      color: var(--accent); 
      margin-bottom: 12px; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }

    .lesson { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 10px 12px; 
      border-radius: 12px; 
      background: var(--surface-variant); 
      margin-bottom: 8px; 
      animation: slideIn 0.3s cubic-bezier(0.2, 0, 0, 1) forwards; 
    }
    .lesson-num { 
      background: var(--accent-container); 
      color: var(--accent-on-container); 
      min-width: 28px; 
      height: 28px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 0.85rem; 
    }
    .lesson-name { font-size: 0.95rem; word-break: break-word; }
    .lesson-time { 
      font-size: 0.8rem; 
      color: var(--on-surface-sub); 
      margin-left: auto; 
      white-space: nowrap;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

    @media (max-width: 300px) {
      body { padding: 8px; }
      h1 { font-size: 1.1rem; }
      .icon-btn { width: 36px; height: 36px; }
      .days-grid { grid-template-columns: 1fr; }
      .day-card { padding: 10px; border-radius: 14px; }
      .lesson { padding: 8px; gap: 6px; }
      .lesson-num { min-width: 22px; height: 22px; font-size: 0.75rem; }
      .lesson-name { font-size: 0.8rem; }
      .lesson-time { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1><span class="icon" style="color: var(--accent);">schedule</span> dontbeschool.lol</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleLang()" id="langBtn">EN</button>
      <button class="icon-btn" onclick="toggleSettings()"><span class="icon">settings</span></button>
    </div>
  </header>

  <div id="settingsPanel" class="card settings-panel">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="icon">cloud_download</span>
      <strong id="t_importUrl">Импорт по ссылке (JSON):</strong>
    </div>
    <input type="text" id="urlInput" placeholder="https://raw.githubusercontent.com/.../schedule.json">
    <button class="btn" onclick="fetchFromUrl()"><span class="icon">download</span> <span id="t_btnFetch">Загрузить</span></button>

    <hr style="border: 0; border-top: 1px solid var(--surface-hover); margin: 16px 0;">

    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
      <span class="icon">smart_toy</span>
      <strong id="t_promptTitle">Промт для LLM:</strong>
    </div>
    <div class="prompt-box" id="promptText">Преобразуй данное школьное расписание в JSON формат строго без лишнего текста. Формат: {"Понедельник": [{"name": "Математика", "time": "8:30-9:15"}]}</div>
    <button class="btn" onclick="copyPrompt()"><span class="icon">content_copy</span> <span id="t_btnCopy">Скопировать промт</span></button>

    <hr style="border: 0; border-top: 1px solid var(--surface-hover); margin: 16px 0;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="icon">code</span>
      <strong id="t_jsonTitle">JSON Расписание:</strong>
    </div>
    <textarea id="jsonInput" placeholder='{"Понедельник": [{"name": "Физика", "time": "08:30 - 09:15"}]}'></textarea>
    <button class="btn" onclick="saveAndRender()"><span class="icon">save</span> <span id="t_btnSave">Сохранить и обновить</span></button>
  </div>

  <div id="scheduleOutput" class="days-grid"></div>

  <script>
    const i18n = {
      ru: {
        importUrl: "Импорт по ссылке (JSON):",
        btnFetch: "Загрузить",
        promptTitle: "Промт для LLM:",
        btnCopy: "Скопировать промт",
        jsonTitle: "JSON Расписание:",
        btnSave: "Сохранить и обновить",
        errFormat: "Ошибка в JSON формате!",
        errFetch: "Не удалось загрузить JSON по ссылке!",
        promptText: 'Преобразуй данное школьное расписание в JSON формат строго без лишнего текста. Формат: {"Понедельник": [{"name": "Математика", "time": "8:30-9:15"}]}'
      },
      en: {
        importUrl: "Import via URL (JSON):",
        btnFetch: "Fetch",
        promptTitle: "LLM Prompt:",
        btnCopy: "Copy prompt",
        jsonTitle: "JSON Schedule:",
        btnSave: "Save & Render",
        errFormat: "Invalid JSON format!",
        errFetch: "Failed to fetch JSON from URL!",
        promptText: 'Convert this school schedule into JSON format strictly without extra text. Format: {"Monday": [{"name": "Math", "time": "8:30-9:15"}]}'
      }
    };

    let currentLang = localStorage.getItem('dontbeschool_lang') || 'ru';

    const defaultData = {
      "Пятница": [
        { name: "География", time: "08:30 - 09:15" },
        { name: "Английский/Информатика", time: "09:25 - 10:10" }
      ]
    };

    function applyLang() {
      document.getElementById('langBtn').innerText = currentLang === 'ru' ? 'EN' : 'RU';
      document.getElementById('t_importUrl').innerText = i18n[currentLang].importUrl;
      document.getElementById('t_btnFetch').innerText = i18n[currentLang].btnFetch;
      document.getElementById('t_promptTitle').innerText = i18n[currentLang].promptTitle;
      document.getElementById('t_btnCopy').innerText = i18n[currentLang].btnCopy;
      document.getElementById('t_jsonTitle').innerText = i18n[currentLang].jsonTitle;
      document.getElementById('t_btnSave').innerText = i18n[currentLang].btnSave;
      document.getElementById('promptText').innerText = i18n[currentLang].promptText;
    }

    function toggleLang() {
      currentLang = currentLang === 'ru' ? 'en' : 'ru';
      localStorage.setItem('dontbeschool_lang', currentLang);
      applyLang();
    }

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('active');
    }

    function render(data) {
      const container = document.getElementById('scheduleOutput');
      container.innerHTML = '';
      
      Object.keys(data).forEach(day => {
        const dayEl = document.createElement('div');
        dayEl.className = 'day-card';
        
        let lessonsHTML = data[day].map((item, index) => `
          <div class="lesson" style="animation-delay: ${index * 0.05}s">
            <div class="lesson-num">${index + 1}</div>
            <span class="lesson-name">${item.name}</span>
            <span class="lesson-time">${item.time || ''}</span>
          </div>
        `).join('');

        dayEl.innerHTML = `
          <div class="day-title">
            <span class="icon">calendar_today</span>
            ${day}
          </div>
          ${lessonsHTML}
        `;
        container.appendChild(dayEl);
      });
    }

    function saveAndRender() {
      try {
        const raw = document.getElementById('jsonInput').value;
        const parsed = JSON.parse(raw);
        localStorage.setItem('dontbeschool_data', raw);
        render(parsed);
        toggleSettings();
      } catch(e) {
        alert(i18n[currentLang].errFormat);
      }
    }

    async function fetchFromUrl() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error();
        const parsed = await res.json();
        const raw = JSON.stringify(parsed, null, 2);
        document.getElementById('jsonInput').value = raw;
        localStorage.setItem('dontbeschool_data', raw);
        render(parsed);
        toggleSettings();
      } catch(e) {
        alert(i18n[currentLang].errFetch);
      }
    }

    function copyPrompt() {
      navigator.clipboard.writeText(document.getElementById('promptText').innerText);
    }

    applyLang();
    const savedData = localStorage.getItem('dontbeschool_data');
    if (savedData) {
      document.getElementById('jsonInput').value = savedData;
      try { render(JSON.parse(savedData)); } catch(e) { render(defaultData); }
    } else {
      document.getElementById('jsonInput').value = JSON.stringify(defaultData, null, 2);
      render(defaultData);
    }
  </script>
</body>
</html>
